projects:
  - eyebrow: Natural Language Processing
    mark: Answers with sources.
    status: Open source
    title: Vietnamese Health Chat LoRA
    description: "LoRA fine-tuning that turns general LLMs into precise, context-aware Vietnamese healthcare assistants — with citations that point back to the source document."
    meta: LoRA · Transformers · Gradio
    href: https://github.com/danhtran2mind/Vietnamese-Health-Chat-LoRA

