title: Twenty projects, one direction.
lede: Vietnamese-first AI — language, speech, vision, and the pipelines that move the data.

sectionEyebrow: Open source & personal work
sectionNote: "20 repositories across computer vision, NLP, audio, and data engineering."
labels:
