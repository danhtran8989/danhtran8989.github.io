posts:
  - slug: boost-your-online-skills
    category: Tooling
    title: Encrypted snippets and other online skills
    read: 4 min read
    date: May 2025
    excerpt: "A small habit that keeps reusable browser and terminal scripts out of plain sight — and the Kaggle idle-timeout workaround that started it."
    content:
      - type: p
        text: "Some scripts are useful enough that you want them in every browser session, and awkward enough that you do not want them copied around in plain text. Encrypting the payload and decrypting it when needed is a low-effort middle ground."
      - type: h2
        text: Why bother encrypting a snippet
      - type: p
        text: "Public gists are searchable forever. If a helper script touches a session, an account, or a dataset you care about, publishing it verbatim is a bad default. Encrypting it means the note survives while the working code stays quiet."
      - type: h2
        text: The Kaggle case
      - type: p
        text: "Kaggle disconnects idle notebooks, which is painful during long reads. A short script pasted into the browser console keeps the session warm. I keep it encrypted in the post, decrypt it when I need it, and avoid leaving a ready-to-paste script in a public index."
      - type: h2
        text: The workflow
      - type: ul
        items:
          - Encrypt the snippet once and keep only the ciphertext in the note.
          - Paste the ciphertext into a small decryption step that runs locally.
          - Re-encrypt whenever the script changes, so the published text stays stale by design.
      - type: p
        text: "It is not real security — the key still lives with you. It is a speed bump that stops accidental copying, which is most of what a personal site needs."

  - slug: directory-tree-printer
    category: Python
    title: Printing a directory tree without a dependency
    read: 5 min read
    date: May 2025
    excerpt: "A short recursive function that lists folders before files, hides dotfiles, and draws clean connectors — plus the seedir version when you want emoji."
    content:
      - type: p
        text: "I keep needing a quick view of a project's shape: which folders exist, what sits inside them, and what is noise. A readable directory tree is faster than clicking through a file browser."
      - type: h2
        text: The core idea
      - type: p
        text: "List the entries, split directories from files, drop anything starting with a dot, sort both groups, then recurse into each directory while carrying an indentation prefix. The last entry in a list gets a corner connector instead of a tee so the drawing closes cleanly."
      - type: ul
        items:
          - Directories first, then files — that ordering is what makes the output readable.
          - Skip hidden entries by default; they are rarely what you are looking for.
          - Recurse with a prefix that matches the connector you just printed.
      - type: h2
        text: When you want it prettier
      - type: p
        text: "The seedir package does the same job with emoji icons, item limits, and a beyond marker for long folders. I install it when the output is going into a README rather than a terminal."
      - type: blockquote
        text: "A directory tree is documentation you generate instead of maintain."

  - slug: github-setup-and-encryption-guide
    category: Tooling
    title: GitHub setup and file encryption on Linux
    read: 6 min read
    date: Apr 2025
    excerpt: "The setup I repeat on every fresh machine: git identity, credentials, and git-crypt for the files that should never land in plain text."
    content:
      - type: p
        text: "Setting up Git on a new Linux box is a five-minute job with a long tail of small decisions. Here is the version I actually reuse, including the part most guides skip: encrypting a subset of files before they reach a remote."
      - type: h2
        text: Install and identify yourself
      - type: p
        text: "Start with git, git-lfs, git-crypt, and gnupg. Then set the user name and email so commits are attributed correctly, and pick your default branch name once instead of fixing it later."
      - type: ul
        items:
          - Set name, email, and the initial branch in the global config.
          - Generate a GPG key if you want signed commits, and register it on GitHub.
          - Authenticate with SSH keys or the GitHub CLI rather than a password.
      - type: h2
        text: Encrypt what should stay local
      - type: p
        text: "git-crypt lets you keep a file in the repository while storing it encrypted. You add the paths to a filter definition, initialise the repository once, and hand the symmetric key to whoever needs to read them. Without the key, the file is committed as ciphertext."
      - type: p
        text: "The important detail: adding a file after encryption is enabled works, but rewriting history to encrypt an old file does not. Decide early, or rotate the key and accept the cleanup."
      - type: h2
        text: A checklist before the first push
      - type: ul
        items:
          - Verify the remote URL and the default branch.
          - Confirm the ignore rules catch environments, data dumps, and credentials.
          - Check that encrypted paths are covered by the filter, not just the ignore file.

  - slug: steps-to-creating-a-readme
    category: Documentation
    title: Steps to creating a README people can follow
    read: 5 min read
    date: October 2024
    excerpt: "A section-by-section template for project READMEs: what it does, how to run it, what it needs, and how to contribute."
    content:
      - type: p
        text: "A README is the cheapest piece of documentation you will ever write, and the one most likely to be read. I keep a template from the Cisco Data Analytics Essentials course and adapt it for every repository."
      - type: h2
        text: Start with the sentence
      - type: p
        text: "The first line answers two questions: what is this, and who is it for. If you cannot fit that into one sentence, the project probably needs scoping before it needs a README."
      - type: h2
        text: Then the sections, in order
      - type: ul
        items:
          - "Project title and one-line description — what it does, not what it is built with."
          - "Table of contents — needed once the README passes a screen and a half."
          - "Installation — exact commands, including the versions that matter."
          - "Usage — the shortest path to a visible result."
          - "Configuration — environment variables and defaults in a table."
          - "Contributing and licence — how to help, and what others may do with it."
      - type: h2
        text: Keep it honest
      - type: p
        text: "Badges that claim more than the code delivers are worse than no badges. A status line saying 'work in progress, training not reproducible' saves everyone time."
      - type: blockquote
        text: "If a step in the README has never been run on a clean machine, it is a wish, not an instruction."

  - slug: iris-flower-classifier
    category: Machine Learning
    title: An Iris classifier with sliders
    read: 4 min read
    date: October 2024
    excerpt: "A Streamlit front end over a scikit-learn model: four measurements in, a species out. Small enough to explain in one sitting."
    content:
      - type: p
        text: "The Iris dataset is the hello-world of classification, but a notebook does not show what a model feels like to use. Wrapping it in Streamlit takes an afternoon and turns four numbers into an interface."
      - type: h2
        text: What the app does
      - type: p
        text: "Sliders set sepal length, sepal width, petal length, and petal width. The trained model returns one of three species, and the result panel repeats the measurements next to the prediction so the input is always visible."
      - type: h2
        text: The stack
      - type: ul
        items:
          - scikit-learn for the model and the train/test split.
          - pandas for loading and shaping the dataset.
          - Streamlit for the layout, sliders, and the predict button.
      - type: h2
        text: Running it
      - type: p
        text: "Activate a virtual environment, install the requirements, then start the app with streamlit run. Everything happens locally, which is the point — the same pattern works for a real model with a real form in front of it."
      - type: p
        text: "The lesson that carried over to bigger projects: a UI makes bad inputs obvious. Half the improvements I made came from watching someone move a slider to a value the training data never contained."

  - slug: hello-world-in-python
    category: Programming
    title: Hello World in Python, properly explained
    read: 3 min read
    date: September 2024
    excerpt: "One line of code, one built-in function, and three concepts worth understanding before moving on."
    content:
      - type: p
        text: "Every Python journey starts with the same line: print Hello World. It looks trivial, and it is, but it touches three ideas you will use forever."
      - type: h2
        text: The code
      - type: p
        text: "Call print with a string literal in parentheses. print is a built-in function — a reusable block that already exists — and the quoted text is a string, which is how Python knows it is data rather than a name in the code."
      - type: h2
        text: Running it
      - type: ul
        items:
          - Save the line in a file ending in .py.
          - Open a terminal in that folder.
          - Run python hello.py and read the output.
      - type: h2
        text: What it actually teaches
      - type: p
        text: "Syntax is the set of rules the interpreter enforces. Functions are named blocks you can call. Strings are values, not instructions. That is the whole foundation, and the rest of the language is detail on top of it."
      - type: blockquote
        text: "The first program is not about printing text; it is about proving the loop from file to output works."
